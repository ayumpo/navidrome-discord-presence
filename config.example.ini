# navidrome-presence configuration
# Copy to config.ini (next to the script) or ~/.config/navidrome-presence/config.ini
# Any setting can also come from an environment variable: NDP_<SECTION>_<KEY>,
# e.g. NDP_NAVIDROME_PASSWORD.

[navidrome]
# The address this computer uses to reach Navidrome (LAN address is fine).
url = http://192.168.1.10:4533
username = your-navidrome-username
password = change-me

# Whose playback to show. Defaults to `username`. Navidrome lists every user's
# now-playing entries, so an admin account can mirror someone else's listening.
# watch_user =

# Only show these players (comma-separated playerName values, as shown by --check).
# players = Narjo, Feishin
# Never show these players.
# ignore_players =

[discord]
# Application ID from https://discord.com/developers/applications
# Name the application what you want after "Listening to …" (e.g. Navidrome).
client_id = 000000000000000000

# The short line under your name / in the member list:
#   app    → "♫ Navidrome"     (the activity name, see below)
#   artist → "♫ Radiohead"
#   track  → "♫ Weird Fishes"
status_display = track

# What comes after "Listening to" on your profile card:
#   app    → your Discord application's name (e.g. "Navidrome")
#   track / artist / album → that field of the current song
#   custom → activity_name_template, with {track} {artist} {artists} {album}
activity_name = app
activity_name_template = {artist} - {track}

# When a client reports pause: show it with a ⏸ marker, or clear the status.
on_pause = show

# Append the album to the artist line.
show_album_in_state = false

# Make the title, artist and album art clickable: none, spotify, youtube, deezer, apple
# spotify opens the exact track when ListenBrainz knows it (search otherwise).
links = none

[artwork]
# Where to get album art Discord can display, tried in order (or "none"):
#   upload  Navidrome's own cover, uploaded to uguu.se (temporary, deleted after 3 h)
#   caa     Cover Art Archive, for albums tagged with MusicBrainz IDs
#   deezer, itunes  look the album up by artist + album name (only names are sent)
sources = deezer, itunes

# Shown when no cover is found: any https image URL (default: the Navidrome logo),
# or the key of an Art Asset uploaded in the Developer Portal (Rich Presence → Art Assets).
fallback_image = https://raw.githubusercontent.com/navidrome/navidrome/master/ui/public/android-chrome-512x512.png

# Small corner badge while paused (asset key or https URL). Default: the same pause
# icon the official plugin uses. Set it empty to show "⏸" in the text instead.
# paused_image =

[general]
# Seconds between Navidrome polls (minimum 2).
poll_interval = 5
# Seconds to keep the last track up after it disappears (bridges track changes).
stop_grace = 12
log_level = INFO
